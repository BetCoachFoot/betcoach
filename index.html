  const d=!SHOW_LATE?(bt?`Pris le ${fmt(bt)}`:ct?`Publié le ${fmt(ct)}`:""):late?`Pris le ${fmt(bt)} · publié le ${fmt(ct)}`:bt?`✓ Pris le ${fmt(bt)}, publié en temps réel`:ct?`Publié le ${fmt(ct)}`:"";
  const adm=isOwner()?(b.status==="pending"?`<div class="row" style="margin-top:10px"><button class="g" onclick="settle('${b.id}','won')">Gagné</button><button class="r" onclick="settle('${b.id}','lost')">Perdu</button><button class="c" onclick="settle('${b.id}','cashout')">Cash out</button></div>`:"")+`<div style="text-align:right"><a class="mu" href="#" onclick="del('${b.id}');return false">supprimer</a></div>`:"";
  return `<div class="card bet s-${b.status}"><div class="hd"><div class="t"><b>${esc(b.match)}</b><span class="ty">${esc(b.type)}</span></div><div class="od"><i>cote</i><b>${Number(b.odds).toFixed(2).replace(".",",")}</b></div></div><div class="ft"><span class="tag ${b.status}">${LBL[b.status]}</span><span class="mu">mise ${eur(b.stake)}</span>${b.status!=="pending"?`<span class="pl ${p>=0?"pos":"neg"}">${p>=0?"+":""}${eur(p)}</span>`:""}</div><div class="mu dt">${SHOW_LATE&&late?'<span class="tag late">Ajouté après coup</span> ':""}${d}</div>${adm}</div>`}
function chart(L){
  const pts=[0];let c=0;L.slice().reverse().forEach(b=>{if(b.status!=="pending"){c+=profit(b);pts.push(c)}});
  if(pts.length<2)return'<div class="mu" style="padding:30px 0;text-align:center">La courbe apparaîtra après le premier pari clôturé.</div>';
  const mn=Math.min(...pts),mx=Math.max(...pts),r=(mx-mn)||1,W=320,H=140;
  const d=pts.map((v,i)=>(i/(pts.length-1)*W).toFixed(1)+","+(H-8-((v-mn)/r)*(H-16)).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Bénéfice cumulé"><polyline points="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/></svg>`}
const sv=d=>`<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON={"📋":sv('<path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/>'),"➕":sv('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'),"🎁":sv('<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M3 9h18M12 9v11M12 9C10 9 8 8 8 6.5S10 4 12 9zM12 9c2 0 4-1 4-2.5S14 4 12 9z"/>'),"📘":sv('<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>'),"📈":sv('<path d="M4 19V5M4 19h16"/><path d="M8 14l3-3 3 2 5-6"/>'),"👥":sv('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.5-3 2.7-4.5 5.5-4.5s5 1.5 5.5 4.5"/><path d="M16 5.5a3 3 0 0 1 0 5.5M17.5 14.7c1.8.5 3 1.8 3.3 4.3"/>'),"👤":sv('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-3.6 3.4-5.5 7-5.5s6.4 1.9 7 5.5"/>')};
const navHtml=T=>T.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="go('${t[0]}')">${ICON[t[1]]||t[1]}${t[2]}</button>`).join("");
const formStrip=L=>{const d=L.filter(b=>b.status!=="pending").sort((a,b)=>tm(a)-tm(b)).slice(-8);if(!d.length)return"";return'<div class="form" role="img" aria-label="Forme récente : '+d.map(b=>LBL[b.status]).join(", ")+'">'+d.map(b=>`<i class="f f-${b.status}">${b.status==="won"?"G":b.status==="lost"?"P":"C"}</i>`).join("")+'</div>'};
const PITCH='<svg class="pitch" viewBox="0 0 220 160" aria-hidden="true"><circle cx="150" cy="80" r="46"/><path d="M150 0v160"/><circle cx="150" cy="80" r="3" fill="rgba(255,255,255,.17)"/></svg>';
const kv=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
function freeView(){
  const L=free.slice().sort(byTime),done=L.filter(b=>b.status!=="pending"),pr=done.reduce((a,b)=>a+profit(b),0),w=done.filter(b=>profit(b)>0).length;
  return `<div class="hero">${PITCH}<h1>Paris gratuits</h1><p>Accessibles à tous, sans abonnement. Un aperçu de notre façon de jouer. Tu restes seul juge de ta mise : elle doit pouvoir être perdue sans conséquence.</p>${done.length?`<div class="formrow"><span>Forme récente</span>${formStrip(L)}</div><p class="sm">${w} gagné${w>1?"s":""} sur ${done.length} clos · ${pr>=0?"+":""}${eur(pr)} de bénéfice</p>`:""}<div class="trust"><span>Historique public, pertes comprises</span><span>Chaque pari est daté</span></div><p class="sm">18 ans et plus. Les résultats passés ne garantissent rien.</p></div>`+(L.length?L.map(card).join(""):'<div class="card"><h2>Pas encore de pari gratuit</h2><div class="mu">Le prochain apparaîtra ici dès sa publication.</div></div>')}
function calcHtml(){
  if(!(BK>0))return'<div class="mu">Saisis le montant de ta bankroll.</div>';
  return kv("1 U (1 % de la bankroll)",eur(BK/100))+kv("Mise prudente · 0,5 U",eur(BK/200))+kv("Mise standard · 1 U",eur(BK/100))+kv("Mise forte · 2 U maximum",eur(BK/50))
   +kv("10 pertes de suite à 1 U",eur(BK*0.9)+" (−10 %)")+kv("20 pertes de suite à 1 U",eur(BK*0.8)+" (−20 %)")
   +kv("10 pertes de suite à 10 % par pari",eur(BK*Math.pow(0.9,10))+" (−65 %)")
   +'<div class="mu" style="margin-top:6px">Comparaison : miser 1 % par pari te laisse le temps de rebondir après une mauvaise série.</div>'}
function probHtml(){
  if(!(PR>0&&PR<100))return'<div class="mu">Saisis une probabilité entre 1 et 99 %.</div>';
  return kv("Cote minimale pour avoir de la value",(100/PR).toFixed(2).replace(".",","))+'<div class="mu" style="margin-top:6px">Au-dessus de cette cote, le pari a de la value selon TON estimation. Estimer correctement une probabilité est la partie difficile : en cas de doute, ne mise pas.</div>'}
window.calc=()=>{BK=parseFloat($("bk")?$("bk").value:BK);PR=parseFloat($("pr")?$("pr").value:PR);if($("calcOut"))$("calcOut").innerHTML=calcHtml();if($("probOut"))$("probOut").innerHTML=probHtml()};
function tipsView(){
  const sec=(t,b)=>`<div class="card"><h2>${t}</h2>${b}</div>`,ul=a=>'<ul class="tl">'+a.map(x=>`<li>${x}</li>`).join("")+'</ul>',chk=a=>a.map(x=>`<label class="chk"><input type="checkbox"><span>${x}</span></label>`).join("");
  return '<div class="hero'+'">'+PITCH+'<h1>Miser avec méthode</h1><p>Des repères pour garder le contrôle. Ils ne garantissent aucun gain : les paris sportifs restent un jeu d’argent, et la plupart des joueurs perdent sur la durée.</p><div class="quote">La discipline reste toujours la priorité.</div></div>'
  +sec("Gérer sa bankroll",ul(["Ta bankroll est une somme dédiée aux paris, séparée de ton budget du quotidien. Tu dois pouvoir la perdre sans conséquence.","<b>1 U (unité) = 1 % de ta bankroll.</b> Tu raisonnes en unités, pas en euros.","Pari standard : 1 U. Plus sûr de toi : 2 U au maximum. Un doute ? 0,5 U, ou rien.","Recalcule ton unité de temps en temps (par exemple chaque semaine), pas après chaque pari.","Pense comme un investisseur, pas comme un joueur : l’objectif est de durer, pas de se refaire en un coup."])+`<div style="margin-top:12px"><div class="mu">Ma bankroll (€)</div><input id="bk" type="number" inputmode="decimal" value="${isNaN(BK)?"":BK}" oninput="calc()"><div id="calcOut">${calcHtml()}</div></div>`)
  +sec("Les objectifs",ul(["Protéger le capital.","Survivre aux mauvaises séries : elles arrivent à tout le monde.","Faire croître la bankroll progressivement.","Juger ta méthode sur 100, 500, voire 1 000 paris, pas sur quelques jours : sur un petit échantillon, la chance pèse plus que la méthode."]))
  +sec("La force mentale",ul(["<b>Ne parie jamais par ennui.</b> Pas de match intéressant, pas de pari.","<b>Ne cherche pas à te refaire après une perte.</b> C’est là que les mises dérapent. Fais une pause.","Fixe tes limites à l’avance : par exemple, stop pour la journée après 3 U perdues.","<b>Attends la bonne opportunité.</b> Tous les matchs n’en sont pas. Ne pas parier est aussi une décision.","Cherche de la value et de la régularité, pas le gros coup."]))
  +sec("Lire un match, surtout en live",ul(["On ne parie pas un logo ni un classement : un leader peut avoir un mauvais soir.","Regarde le vrai momentum : qui domine réellement ? Tirs, tirs cadrés, corners, occasions franches.","Observe l’intensité et le rythme, ainsi que la motivation des équipes : enjeu, calendrier, rotations, fatigue.","Tiens compte des événements : carton rouge, blessure, changement tactique.","Les championnats moins médiatisés présentent parfois de gros écarts de niveau, avec des cotes live ajustées moins vite. Mais l’information y est moins fiable et les mises souvent plafonnées : sois prudent, rien n’est garanti.","Le contexte reste essentiel : une statistique seule ne suffit jamais."]))
  +sec("La value",'<div class="mu" style="margin:4px 0 8px">Un pari a de la value quand la probabilité que tu estimes est supérieure à celle que la cote suppose.</div><div class="mu">Ma probabilité estimée (%)</div><input id="pr" type="number" inputmode="decimal" value="'+(isNaN(PR)?"":PR)+'" oninput="calc()"><div id="probOut">'+probHtml()+'</div>')
  +sec("Check-list avant de miser",chk(["Mon pari repose sur des infos, pas sur une envie de jouer.","Je n’essaie pas de récupérer une perte.","Ma mise ne dépasse pas 2 U.","J’ai vérifié le contexte : compos, enjeu, statistiques.","Je peux me permettre de perdre cette mise."]))
  +sec("Jouer sans se mettre en danger",ul(["N’engage que de l’argent que tu peux te permettre de perdre. Ne t’endette jamais pour jouer.","Utilise les limites de dépôt et de mise de ton opérateur, et fais des pauses régulières.","Le jeu te pose problème ? Joueurs Info Service : 09 74 75 13 13 (appel gratuit). Tu peux aussi demander une interdiction volontaire de jeux auprès de l’ANJ.","Interdit aux moins de 18 ans."]))}
function pubView(){
  const L=pub.slice().sort((a,b)=>tm(b)-tm(a));
  if(!L.length)return'<div class="card"><b>Historique public</b><div class="mu">Les premiers résultats apparaîtront ici.</div></div>';
  const pr=L.reduce((a,b)=>a+profit(b),0),st=L.reduce((a,b)=>a+b.stake,0),w=L.filter(b=>profit(b)>0).length;
  return `<div class="card"><b>Historique public</b><div class="mu">Tous les paris clôturés, gains et pertes compris. Les résultats passés ne garantissent rien.</div><div class="big ${pr>=0?"pos":"neg"}">${pr>=0?"+":""}${eur(pr)}</div>${chart(L)}</div><div class="card stats"><div><b>${L.length}</b><span class="mu">Paris</span></div><div><b>${Math.round(w/L.length*100)} %</b><span class="mu">Réussite</span></div><div><b>${(pr/st*100).toFixed(1)} %</b><span class="mu">ROI</span></div></div>`+L.slice(0,10).map(card).join("")}
function render(){
  if(tab==="tips"&&document.activeElement&&(document.activeElement.id==="bk"||document.activeElement.id==="pr"))return;
  if(user&&tab==="add"&&$("m"))return;
  const app=$("app"),nav=$("nav");
  if(!user){nav.hidden=false;$("out").hidden=true;
    const T=[["free","🎁","Gratuits"],["tips","📘","Conseils"],["login","👤","Compte"]];
    if(!T.some(t=>t[0]===tab))tab="free";
    nav.innerHTML=navHtml(T);
    if(tab==="free"){app.innerHTML=installCard()+freeView()+'<div class="card"><b>Les autres paris</b><div class="mu">Les paris en cours hors gratuits sont réservés aux abonnés.</div><button style="width:100%;margin-top:10px" onclick="go(\'login\')">Se connecter ou créer un compte</button></div>';return}
    if(tab==="tips"){app.innerHTML=tipsView();return}
    const ids=["e","p","r","a"],k=ids.map(i=>$(i)?($(i).type==="checkbox"?$(i).checked:$(i).value):null);
    app.innerHTML=pubView()+'<div class="card"><b>Suivre les paris en cours</b><p class="mu">Connecte-toi, ou crée un compte abonné.</p><input id="e" type="email" placeholder="E-mail" autocomplete="email"><input id="p" type="password" placeholder="Mot de passe" autocomplete="current-password"><input id="r" placeholder="Code parrain (facultatif)" value="'+esc(REF)+'"><label class="mu" style="display:block;margin-bottom:10px"><input id="a" type="checkbox" style="width:auto;margin:0 6px 0 0">J’ai 18 ans ou plus</label><div class="row"><button onclick="login()">Se connecter</button><button class="s" onclick="signup()">Créer un compte</button></div></div>';
    ids.forEach((i,j)=>{if(k[j]!==null){if($(i).type==="checkbox")$(i).checked=k[j];else $(i).value=k[j]}});return}
  nav.hidden=false;$("out").hidden=false;
  if(!isOwner()&&me===null){app.innerHTML='<div class="card mu">Chargement…</div>';nav.hidden=true;return}
  if((!isOwner()&&(tab==="add"||tab==="acc"))||(!hasAccess()&&tab==="track"))tab="feed";
  const tabs=[["feed","📋","Paris"]].concat(isOwner()?[["add","➕","Pari"]]:[]).concat([["free","🎁","Gratuits"],["tips","📘","Conseils"]]).concat(hasAccess()?[["track","📈","Bénéfice"]]:[]).concat(isOwner()?[["acc","👥","Comptes"]]:[]).concat([["me","👤","Profil"]]);
  if(!tabs.some(t=>t[0]===tab))tab="feed";
  nav.innerHTML=navHtml(tabs);
  let h="";
  if(tab==="free")h=freeView();
  if(tab==="tips")h=tipsView();
  if(tab==="feed")h=hasAccess()?installCard()+pushCard()+(bets.length?bets.map(card).join(""):'<div class="card mu">Aucun pari pour l’instant.</div>'):installCard()+accessCard()+pubView();
  if(tab==="add")h='<div class="card"><b>Nouveau pari</b><p class="mu">Date et heure : celles de ton ticket Betclic.'+(SHOW_LATE?' Un pari ajouté après coup est signalé comme tel aux abonnés.':'')+'</p><input id="m" placeholder="Match (ex. PSG – OM)"><input id="t" placeholder="Pari (ex. Victoire PSG)"><div class="row"><input id="o" type="number" step="0.01" inputmode="decimal" placeholder="Cote"><input id="s" type="number" step="0.5" inputmode="decimal" placeholder="Mise €"></div><div class="mu">Date et heure du pari</div><input id="d" type="datetime-local" value="'+nowLocal()+'"><div class="mu">Résultat</div><select id="st"><option value="pending">En cours</option><option value="won">Gagné</option><option value="lost">Perdu</option><option value="cashout">Cash out</option></select><input id="ca" type="number" step="0.01" inputmode="decimal" placeholder="Montant du cash out € (si cash out)"><label class="chk"><input id="fr" type="checkbox"><span>🎁 Pari gratuit : visible par tous, sans abonnement</span></label><button style="width:100%" onclick="addBet()">Enregistrer le pari</button></div>';
  if(tab==="track"){const done=bets.filter(b=>b.status!=="pending"),pr=done.reduce((a,b)=>a+profit(b),0),st=done.reduce((a,b)=>a+b.stake,0),w=done.filter(b=>profit(b)>0).length,pend=bets.filter(b=>b.status==="pending").reduce((a,b)=>a+b.stake,0);
    h=`<div class="card"><div class="mu">Bénéfice cumulé</div><div class="big ${pr>=0?"pos":"neg"}">${pr>=0?"+":""}${eur(pr)}</div>${chart(bets)}<div class="mu" style="margin:10px 0 6px">Forme récente</div>${formStrip(bets)}</div><div class="card stats"><div><b>${st?(pr/st*100).toFixed(1):"0"} %</b><span class="mu">ROI</span></div><div><b>${done.length?Math.round(w/done.length*100):0} %</b><span class="mu">Réussite</span></div><div><b>${eur(pend)}</b><span class="mu">En jeu</span></div></div>`}
  if(tab==="me"){const c=user.uid.slice(0,6).toUpperCase(),link=location.origin+location.pathname+"?ref="+c;
    h=`<div class="card"><b>Mon code parrain</b><div class="big">${c}</div><div class="mu" style="word-break:break-all">${esc(link)}</div><button style="width:100%;margin-top:10px" onclick="share('${link}')">Partager mon lien</button></div>`}
  if(tab==="me"&&!hasAccess())h=accessCard()+h;
  if(tab==="me"&&hasAccess()){const pn=("Notification"in window)?Notification.permission:"x";
    h+=`<div class="card"><b>Notifications</b><div class="mu">${pn==="granted"?"✓ Autorisées sur cet appareil.":pn==="denied"?"Bloquées : réactive-les dans les réglages de l’appareil.":pn==="x"?"Non disponibles ici.":"Non activées."}</div><button class="s" style="width:100%;margin-top:10px" onclick="enablePush()">${pn==="granted"?"Actualiser":"Activer les notifications"}</button></div>`}
  if(tab==="acc"&&isOwner()){
    const L=subs.filter(x=>x.email!==OWNER).sort((a,b)=>(b.createdAt?b.createdAt.seconds:0)-(a.createdAt?a.createdAt.seconds:0)),nA=L.filter(x=>x.active===true).length;
    h=`<div class="card"><b>Comptes</b><div class="mu">${L.length} comptes · ${nA} actifs</div></div>`+(L.length?L.map(x=>{const on=x.active===true;return `<div class="card"><div class="top"><b style="word-break:break-all">${esc(x.email||"?")}</b><span class="tag ${on?"won":"pending"}">${on?"Actif":"Inactif"}</span></div><div class="mu">${x.createdAt&&x.createdAt.toDate?"Inscrit le "+x.createdAt.toDate().toLocaleDateString("fr-FR"):""}${x.referredBy?" · parrain "+esc(x.referredBy):""}${(x.fcmTokens||[]).length?" · 🔔":""}</div><button class="${on?"r":"g"}" style="width:100%;margin-top:10px" onclick="setAccess('${x.uid}',${on?"false":"true"})">${on?"Désactiver l’accès":"Activer l’accès"}</button></div>`}).join(""):'<div class="card mu">Aucun compte pour l’instant.</div>')}
  app.innerHTML=h}
window.go=t=>{tab=t;render();scrollTo(0,0)};
function wire(){
  const full=hasAccess(),key=(user?user.uid:"")+"|"+full;
  if(key===wiredFor)return;wiredFor=key;
  if(unsub){unsub();unsub=null}
  bets=[];pub=[];
  if(full)unsub=onSnapshot(query(collection(db,"bets"),orderBy("createdAt","desc")),s=>{bets=s.docs.map(d=>({id:d.id,...d.data()})).sort(byTime);render()},fail);
  else unsub=onSnapshot(query(collection(db,"bets"),where("status","in",["won","lost","cashout"])),s=>{pub=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
}
function wireFree(){if(unsubFree)return;unsubFree=onSnapshot(query(collection(db,"bets"),where("free","==",true)),s=>{free=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{})}
wireFree();
onAuthStateChanged(auth,u=>{user=u;[unsubMe,unsub2].forEach(f=>f&&f());unsubMe=unsub2=null;me=null;subs=[];tab="feed";wiredFor=null;
  if(u){unsubMe=onSnapshot(doc(db,"subscribers",u.uid),s=>{me=s.exists()?s.data():{};wire();render()},()=>{me={};wire();render()});
    if(u.email===OWNER)unsub2=onSnapshot(collection(db,"subscribers"),s=>{subs=s.docs.map(d=>({uid:d.id,...d.data()}));render()},()=>{})}
  wire();render()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
